<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOID SANCTUM INJECTOR</title>
    <!-- Fonts: Orbitron, Rajdhani, Cinzel, Share Tech Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* ── Dynamic Cosmic Themes: EXACTLY 3 SKINS (Void Violet, Ice Frost, Royal Gold) ── */
        :root {
            /* Default: Void Violet */
            --theme-color: #a855f7;
            --theme-bright: #c084fc;
            --theme-glow: rgba(168, 85, 247, 0.75);
            --theme-glow-soft: rgba(168, 85, 247, 0.28);
            --theme-dark: #581c87;
            --theme-accent: #e879f9;
            --theme-steel: #b49eb5;
            --theme-steel-dim: #5c4d73;
            --frame-filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.65));
        }

        /* 1. Void Violet (Amethyst Singularity - Default) */
        .theme-void {
            --theme-color: #a855f7;
            --theme-bright: #c084fc;
            --theme-glow: rgba(168, 85, 247, 0.75);
            --theme-glow-soft: rgba(168, 85, 247, 0.28);
            --theme-dark: #581c87;
            --theme-accent: #e879f9;
            --theme-steel: #b49eb5;
            --frame-filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.65));
        }

        /* 2. Ice Frost (Cyan Glaze) */
        .theme-ice {
            --theme-color: #06b6d4;
            --theme-bright: #38bdf8;
            --theme-glow: rgba(6, 182, 212, 0.75);
            --theme-glow-soft: rgba(6, 182, 212, 0.28);
            --theme-dark: #0e7490;
            --theme-accent: #3b82f6;
            --theme-steel: #93c5fd;
            --frame-filter: hue-rotate(280deg) saturate(1.3) drop-shadow(0 0 16px rgba(6, 182, 212, 0.65));
        }

        /* 3. Royal Gold (Obsidian & 24K Dragon Gold) */
        .theme-dragon {
            --theme-color: #eab308;
            --theme-bright: #fde047;
            --theme-glow: rgba(234, 179, 8, 0.85);
            --theme-glow-soft: rgba(234, 179, 8, 0.35);
            --theme-dark: #713f12;
            --theme-accent: #ca8a04;
            --theme-steel: #fef08a;
            --frame-filter: hue-rotate(125deg) saturate(2.0) contrast(1.15) drop-shadow(0 0 16px rgba(234, 179, 8, 0.65));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', 'Orbitron', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* ── Core Transparent Background for Floating Overlay ── */
        body {
            background: transparent !important;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            pointer-events: none;
        }
        
        #bgFrame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        /* ── Draggable Floating Action Button (FAB) ── */
        #mini {
            position: absolute;
            left: 20px;
            top: 100px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(65, 20, 95, 0.95), rgba(12, 3, 20, 0.98));
            border: 2px solid var(--theme-color);
            box-shadow: 0 0 18px var(--theme-glow), inset 0 0 10px var(--theme-glow-soft);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2147483646;
            touch-action: none;
            pointer-events: auto;
            transition: transform 0.15s ease, border-color 0.3s;
        }
        #mini:active {
            transform: scale(0.92);
        }
        #mini-ring-pulse {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1.5px dashed var(--theme-bright);
            animation: ringSpin 9s linear infinite;
            pointer-events: none;
        }
        #spd-fab-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #spd-fab-icon svg {
            width: 22px;
            height: 22px;
            fill: var(--theme-bright);
            filter: drop-shadow(0 0 6px var(--theme-color));
            animation: starSpinPulse 12s linear infinite;
        }
        #spd-fab-dot {
            position: absolute;
            right: 2px;
            top: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--theme-color);
            box-shadow: 0 0 8px var(--theme-color);
            z-index: 5;
            animation: dot-pulse 1.1s infinite;
        }

        /* ==========================================================================
           STAGE PANEL: VOID SANCTUM INJECTOR (Native Frame Chassis)
           Strictly NO Corner Circles! Fits Image 4 Borders Perfectly!
           ========================================================================== */
        #stage {
            display: block;
            position: absolute;
            left: calc(50% - 165px);
            top: calc(50% - 154px);
            width: 330px;
            height: 308px;
            z-index: 2147483647;
            touch-action: none;
            cursor: grab;
            will-change: left, top, opacity;
            pointer-events: auto;
            animation: spdFadeIn .25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        #stage.spd-open {
            display: block !important;
            animation: spdFadeIn .25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        #stage.spd-close {
            animation: spdFadeOut .2s ease-in forwards;
            pointer-events: none;
        }

        /* ── Image 4 Native Void Sanctum Frame Graphic ── */
        .stage-frame-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            z-index: 2;
            filter: var(--frame-filter);
            transition: filter 0.4s ease;
        }

        /* ── Top-Right Window Controls: ONLY Single Clean Close Hitbox over [X] ── */
        /* Minimize button completely removed as requested */
        .frame-close-hitbox {
            position: absolute;
            right: 8.5%;
            top: 19%;
            width: 22px;
            height: 22px;
            border-radius: 3px;
            background: transparent;
            cursor: pointer;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .frame-close-hitbox:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 10px var(--theme-glow);
        }

        /* ── Inner Content Container (Tailored to Frame Inner Borders) ── */
        .stage-inner-box {
            position: absolute;
            left: 17.5%;
            right: 17.5%;
            top: 29.5%;
            bottom: 14%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
            padding: 2px 2px;
            pointer-events: auto;
        }

        /* ── Inner Header Title (VOID SANCTUM INJECTOR) ── */
        .inner-header {
            text-align: center;
            margin-bottom: 3px;
            cursor: grab;
        }
        .inner-header:active {
            cursor: grabbing;
        }
        .inner-main-title {
            font-family: 'Cinzel', 'Orbitron', sans-serif;
            font-size: 13.5px;
            font-weight: 900;
            letter-spacing: 1.6px;
            color: var(--theme-bright);
            text-shadow: 0 0 10px var(--theme-color), 0 0 20px var(--theme-dark);
            line-height: 1.1;
            animation: voidTextGlow 3s infinite;
        }
        .inner-sub-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 6.5px;
            letter-spacing: 4px;
            color: var(--theme-steel);
            text-transform: uppercase;
            margin-top: 1px;
            opacity: 0.9;
        }

        /* ── Main Grid: Left 3 Tabs + Right Telemetry (No Vertical Gaps) ── */
        .stage-main-grid {
            display: grid;
            grid-template-columns: 66px 1fr;
            gap: 6px;
            flex-grow: 1;
            align-items: stretch;
            min-height: 84px;
        }

        /* ── Left Vertical Navigation Tabs (Exactly 3 Tabs - NO GAPS) ── */
        .vertical-tabs-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
            justify-content: flex-start;
        }

        .v-tab-btn {
            height: 26px;
            position: relative;
            overflow: hidden;
            border-radius: 5px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            padding: 0 6px;
            gap: 5px;
            color: #d1b8dc;
            font-family: 'Orbitron', sans-serif;
            font-size: 7px;
            font-weight: 800;
            letter-spacing: 0.8px;
            cursor: pointer;
            border: 1px solid rgba(120, 40, 160, 0.5);
            outline: none;
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: linear-gradient(90deg, rgba(16, 5, 24, 0.95) 0%, rgba(55, 15, 80, 0.85) 30%, var(--theme-glow-soft) 50%, rgba(55, 15, 80, 0.85) 70%, rgba(16, 5, 24, 0.95) 100%);
            background-size: 250% 100%;
            animation: flowBtnGrad 6s linear infinite;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }
        .v-tab-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 100%);
            border-radius: 5px 5px 0 0;
            pointer-events: none;
        }
        .v-tab-btn svg {
            width: 11px;
            height: 11px;
            fill: currentColor;
            flex-shrink: 0;
            transition: transform 0.2s ease, fill 0.2s ease;
        }
        .v-tab-btn:hover {
            color: #ffffff;
            border-color: var(--theme-bright);
            box-shadow: 0 0 10px var(--theme-glow);
        }
        .v-tab-btn.active {
            color: #ffffff;
            border: 1.2px solid var(--theme-color);
            background: linear-gradient(90deg, var(--theme-dark) 0%, var(--theme-color) 50%, var(--theme-bright) 100%);
            background-size: 300% 100%;
            animation: flowAurora 3.5s ease infinite alternate;
            box-shadow: 0 0 12px var(--theme-glow), inset 0 0 8px rgba(255, 255, 255, 0.3);
            text-shadow: 0 0 6px rgba(0,0,0,0.9);
        }
        .v-tab-btn.active svg {
            fill: #ffffff;
            filter: drop-shadow(0 0 4px #ffffff);
            transform: scale(1.15);
        }

        /* ── Right Content Box (Telemetry, Skins, Settings) ── */
        .right-content-col {
            background: rgba(12, 3, 18, 0.88);
            border: 1px solid rgba(130, 45, 175, 0.55);
            border-radius: 6px;
            padding: 4px 6px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.9);
        }

        /* Laser Sweep Sheen */
        .laser-beam {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent 40%, rgba(255, 255, 255, 0.08) 50%, transparent 60%);
            transform: rotate(30deg);
            pointer-events: none;
            animation: laserSweep 5s infinite;
        }

        /* ── VIEW 1: INJECT VIEW (Telemetry & Prediction) ── */
        #viewInject {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .telemetry-table {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-family: 'Share Tech Mono', 'Orbitron', monospace;
            font-size: 7.5px;
            letter-spacing: 0.5px;
        }
        .tele-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tele-lbl {
            color: #9f88a8;
            font-weight: 700;
        }
        .tele-val {
            font-weight: 800;
            color: #ffffff;
        }
        .tele-val.theme-val {
            color: var(--theme-bright);
            display: flex;
            align-items: center;
            gap: 3px;
            text-shadow: 0 0 8px var(--theme-color);
        }
        .tele-val.theme-val .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--theme-bright);
            box-shadow: 0 0 8px var(--theme-bright);
            animation: dot-pulse 1.2s infinite;
        }

        /* Result Area */
        #tele-result-display {
            border-top: 1px solid rgba(140, 50, 180, 0.4);
            padding-top: 2px;
            margin-top: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .res-period-tag {
            font-family: 'Share Tech Mono', monospace;
            font-size: 7px;
            color: #c9b0d6;
            letter-spacing: 0.8px;
        }
        .prediction-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 14.5px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-shadow: 0 0 10px var(--theme-color), 0 0 20px var(--theme-dark);
            margin-top: 1px;
        }
        .prediction-text.glow-big {
            color: #38bdf8;
            text-shadow: 0 0 12px #0284c7, 0 0 25px #0369a1;
        }
        .prediction-text.glow-small {
            color: #f43f5e;
            text-shadow: 0 0 12px #e11d48, 0 0 25px #be123c;
        }

        /* Singularity Vortex Loader */
        .tele-loader {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .void-singularity-spinner {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top: 2px solid var(--theme-bright);
            border-right: 2px solid var(--theme-color);
            border-bottom: 2px solid var(--theme-dark);
            animation: ringSpin 0.7s linear infinite;
        }
        .loader-txt {
            font-family: 'Orbitron', sans-serif;
            font-size: 6.5px;
            letter-spacing: 1px;
            color: var(--theme-bright);
            font-weight: 800;
        }

        /* ── VIEW 2: SKINS VIEW (EXACTLY 3 SKINS: Void Violet, Ice Frost, Royal Gold) ── */
        #viewSkins {
            display: none;
            flex-direction: column;
            gap: 5px;
            height: 100%;
            justify-content: center;
        }

        .skin-option-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 6px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid rgba(90, 30, 120, 0.6);
            background: rgba(18, 5, 26, 0.75);
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .skin-option-card:hover {
            transform: translateX(2px);
            border-color: #fff;
        }
        .skin-option-card.active-skin {
            border-color: var(--theme-color);
            box-shadow: 0 0 8px var(--theme-glow), inset 0 0 6px var(--theme-glow-soft);
            background: rgba(255, 255, 255, 0.1);
        }

        .skin-meta {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .skin-palette-circle {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            box-shadow: 0 0 5px currentColor;
            flex-shrink: 0;
        }
        .skin-thumb-crop {
            width: 18px;
            height: 11px;
            border-radius: 2px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
        }
        .skin-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 7.2px;
            font-weight: 800;
            letter-spacing: 0.6px;
            color: #ffffff;
            white-space: nowrap;
        }

        .skin-tag-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 5.8px;
            font-weight: 800;
            padding: 1px 4px;
            border-radius: 2px;
            background: rgba(0, 0, 0, 0.5);
            color: var(--theme-steel);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .skin-option-card.active-skin .skin-tag-badge {
            background: var(--theme-color);
            color: #000;
            font-weight: 900;
            border-color: var(--theme-color);
        }

        /* ── VIEW 3: SETTINGS VIEW (AUTO / BIG / SMALL - NO GAPS) ── */
        #viewSettings {
            display: none;
            flex-direction: column;
            gap: 4px;
            height: 100%;
            justify-content: flex-start;
        }

        .setting-target-block {
            background: rgba(26, 8, 38, 0.65);
            border: 1px solid rgba(90, 30, 120, 0.6);
            border-radius: 5px;
            padding: 3px 5px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .target-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 6.5px;
            font-weight: 800;
            color: #d6bade;
            letter-spacing: 0.5px;
        }
        .target-pills-row {
            display: flex;
            gap: 3px;
        }
        .target-pill-btn {
            flex: 1;
            height: 19px;
            background: rgba(14, 4, 20, 0.8);
            border: 1px solid rgba(90, 30, 120, 0.6);
            border-radius: 3px;
            color: #b49eb5;
            font-family: 'Orbitron', sans-serif;
            font-size: 6.5px;
            font-weight: 800;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .target-pill-btn:hover {
            border-color: var(--theme-color);
            color: #fff;
        }
        .target-pill-btn.active {
            background: var(--theme-color);
            border-color: var(--theme-bright);
            color: #ffffff;
            font-weight: 900;
            box-shadow: 0 0 8px var(--theme-glow);
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(26, 8, 38, 0.65);
            border: 1px solid rgba(90, 30, 120, 0.6);
            border-radius: 5px;
            padding: 3px 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 6.8px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #d6bade;
        }
        .sub-switch {
            width: 22px;
            height: 11px;
            background: #2a113a;
            border-radius: 6px;
            position: relative;
            cursor: pointer;
            border: 1px solid var(--theme-steel-dim);
            transition: all 0.2s;
        }
        .sub-switch.active {
            background: var(--theme-color);
            border-color: var(--theme-bright);
            box-shadow: 0 0 6px var(--theme-glow);
        }
        .sw-dot {
            width: 7px;
            height: 7px;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 1px;
            left: 1px;
            transition: transform 0.2s cubic-bezier(0.4, 0.0, 0.2, 1);
        }
        .sub-switch.active .sw-dot {
            transform: translateX(11px);
        }

        /* ── Signature Action Button Area (INJECT + HIDE) ── */
        .bottom-action-area {
            display: flex;
            gap: 5px;
            margin-top: 3px;
        }

        #spd-start {
            flex: 3;
            height: 25px;
            border-radius: 5px;
            border: 1.4px solid var(--theme-bright);
            outline: none;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            position: relative;
            overflow: hidden;
            background: linear-gradient(90deg, var(--theme-dark) 0%, var(--theme-color) 50%, var(--theme-bright) 100%);
            background-size: 300% 100%;
            animation: flowAurora 3.5s ease infinite alternate;
            box-shadow: 0 0 14px var(--theme-glow), inset 0 1px 2px rgba(255, 255, 255, 0.4);
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
            transition: transform 0.1s ease;
        }
        #spd-start:active {
            transform: scale(0.96);
        }
        #spd-start::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, transparent 100%);
            border-radius: 5px 5px 0 0;
            pointer-events: none;
        }
        #spd-start::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transform: skewX(-25deg);
            animation: glareSweep 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        #spd-hide {
            flex: 1;
            height: 25px;
            border-radius: 5px;
            border: 1px solid rgba(130, 45, 175, 0.6);
            outline: none;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 7.5px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #c9b0d6;
            position: relative;
            overflow: hidden;
            background: linear-gradient(90deg, rgba(20, 6, 30, 0.95) 0%, rgba(65, 18, 95, 0.85) 50%, rgba(20, 6, 30, 0.95) 100%);
            background-size: 250% 100%;
            animation: flowBtnGrad 6s linear infinite;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
            transition: transform 0.1s ease, border-color 0.2s, color 0.2s;
        }
        #spd-hide:active {
            transform: scale(0.96);
        }
        #spd-hide:hover {
            color: #ffffff;
            border-color: var(--theme-bright);
            box-shadow: 0 0 10px var(--theme-glow);
        }

        /* ── Stage Footer Bar ── */
        .stage-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Share Tech Mono', 'Orbitron', monospace;
            font-size: 6px;
            letter-spacing: 1px;
            color: var(--theme-steel);
            opacity: 0.85;
            margin-top: 1px;
            padding: 0 2px;
        }

        /* ── Keyframe Animations ── */

                            </div>

                                <button class="target-pill-btn active" id="pillAuto" onclick="setTargetMode('AUTO')">AUTO</button>

                        <!-- Audio FX Toggle -->
                        <div class="setting-item">

            <!-- SIGNATURE ACTION BUTTON ROW (INJECT + HIDE) -->
            <div class="bottom-action-area">
                <button id="spd-start" onclick="runInjection()">
                    <span id="startBtnTxt">INJECT</span>
                </button>
                <button id="spd-hide" onclick="closeCard()">HIDE</button>
            </div>

            <!-- FOOTER BAR (Placed directly above bottom diamond crest) -->

    <!-- ==========================================================================
         CORE JAVASCRIPT: BIG/SMALL Target System, Skins, Live API, Drag & Drop
         ========================================================================== -->
    <script>
        // ── 1. COSMIC AUDIO SYNTHESIZER ──
        let audioCtx = null;
        let isAudioEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!isAudioEnabled) return;
            try {
                initAudio();
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(1400, now + 0.05);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'inject') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.28);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
                    osc.start(now);
                    osc.stop(now + 0.28);
                } else if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                    osc.frequency.setValueAtTime(1046.50, now + 0.24); // C6
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
                    osc.start(now);
                    osc.stop(now + 0.38);
                }
            } catch(e) {}
        }

        function toggleAudio(active) {
            isAudioEnabled = active;
        }

        function toggleSubSwitch(el, callback) {
            el.classList.toggle('active');
            const isActive = el.classList.contains('active');
            playSound('click');
            if (callback) callback(isActive);
        }

        // ── 2. TARGET PREDICTION SYSTEM (AUTO, BIG, SMALL) ──
        let userTargetMode = 'AUTO';

        function setTargetMode(mode) {
            userTargetMode = mode;
            playSound('click');
            
            document.querySelectorAll('.target-pill-btn').forEach(btn => btn.classList.remove('active'));
            const statusEl = document.getElementById('targetSettingsStatus');
            
            if (mode === 'AUTO') {
                document.getElementById('pillAuto').classList.add('active');
                if (statusEl) statusEl.innerText = '[AUTO]';
            } else if (mode === 'BIG') {
                document.getElementById('pillBig').classList.add('active');
                if (statusEl) statusEl.innerText = '[BIG]';
            } else if (mode === 'SMALL') {
                document.getElementById('pillSmall').classList.add('active');
                if (statusEl) statusEl.innerText = '[SMALL]';
            }
            try { localStorage.setItem('void_target_mode', mode); } catch(e) {}
        }

        // ── 3. DYNAMIC COSMIC SKINS SWITCHER (Void, Ice, Royal Gold) ──
        let currentSkin = 'theme-void';

        function applySkin(themeClass, cardId) {
            currentSkin = themeClass;
            playSound('click');

            document.body.className = themeClass;

            document.querySelectorAll('.skin-option-card').forEach(c => {
                c.classList.remove('active-skin');
                const badge = c.querySelector('.skin-tag-badge');
                if (badge) badge.innerText = 'SELECT';
            });

            const activeCard = document.getElementById(cardId);
            if (activeCard) {
                activeCard.classList.add('active-skin');
                const badge = activeCard.querySelector('.skin-tag-badge');
                if (badge) badge.innerText = 'ACTIVE';
            }

            try { localStorage.setItem('void_skin_theme', themeClass); } catch(e) {}
        }

        // ── 4. TAB NAVIGATION (INJECT, SKINS, SETTINGS) ──
        function switchTab(tabId) {
            playSound('click');

            document.querySelectorAll('.v-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('viewInject').style.display = 'none';
            document.getElementById('viewSkins').style.display = 'none';
            document.getElementById('viewSettings').style.display = 'none';

            if (tabId === 'inject') {
                document.getElementById('tabInject').classList.add('active');
                document.getElementById('viewInject').style.display = 'flex';
            } else if (tabId === 'skins') {
                document.getElementById('tabSkins').classList.add('active');
                document.getElementById('viewSkins').style.display = 'flex';
            } else if (tabId === 'settings') {
                document.getElementById('tabSettings').classList.add('active');
                document.getElementById('viewSettings').style.display = 'flex';
            }
        }

        // ── 5. WINGO 1M API & AUTONOMOUS PREDICTION ENGINE ──
        const API_URL = "https://draw.ariseplay.com/api/web/v1/lottery/draw-history?page=1&pageSize=10&gameType=1";
        let isScanning = false;
        let lastKnownPeriod = "";

        async function fetchGameData() {
            try {
                const res = await fetch(API_URL, { cache: "no-store" });
                const json = await res.json();
                if (json && json.data && json.data.list && json.data.list.length > 0) {
                    const top = json.data.list[0];
                    const curPeriod = String(top.period);
                    const nextPeriod = String(BigInt(curPeriod) + 1n);
                    return { nextPeriod: nextPeriod, rawNumber: Number(top.number) };
                }
            } catch(e) {}
            return getFallbackData();
        }

        function getFallbackData() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const totalMins = now.getHours() * 60 + now.getMinutes();
            const periodStr = `${year}${month}${day}1000${1000 + totalMins + 1}`;
            return { nextPeriod: periodStr, rawNumber: Math.floor(Math.random() * 10) };
        }

        async function runInjection() {
            if (isScanning) return;
            isScanning = true;
            playSound('inject');

            const startBtn = document.getElementById('spd-start');
            const startTxt = document.getElementById('startBtnTxt');
            const normalView = document.getElementById('tele-normal-view');
            const loaderView = document.querySelector('.tele-loader');
            const resultText = document.getElementById('resultTextDisplay');
            const periodDisp = document.getElementById('periodDisplay');

            if (startTxt) startTxt.innerText = "CALCULATING...";
            if (startBtn) startBtn.style.opacity = "0.75";
            if (normalView) normalView.style.display = "none";
            if (loaderView) loaderView.style.display = "flex";

            // Dynamic Live Ping Update
            const pingEl = document.getElementById('hudPingVal');
            if (pingEl) pingEl.innerText = Math.floor(Math.random() * 12 + 10) + " MS";

            const gameData = await fetchGameData();
            lastKnownPeriod = gameData.nextPeriod;

            setTimeout(() => {
                let finalOutcome = "";
                let chosenNum = 0;

                if (userTargetMode === 'BIG') {
                    finalOutcome = "BIG";
                    const bigNumbers = [5, 6, 7, 8, 9];
                    chosenNum = bigNumbers[Math.floor(Math.random() * bigNumbers.length)];
                } else if (userTargetMode === 'SMALL') {
                    finalOutcome = "SMALL";
                    const smallNumbers = [0, 1, 2, 3, 4];
                    chosenNum = smallNumbers[Math.floor(Math.random() * smallNumbers.length)];
                } else {
                    let seed = 0;
                    for (let i = 0; i < lastKnownPeriod.length; i++) {
                        seed = (seed * 31 + lastKnownPeriod.charCodeAt(i)) % 100000;
                    }
                    const isBig = (seed % 2 === 0);
                    finalOutcome = isBig ? "BIG" : "SMALL";
                    chosenNum = isBig ? (Math.floor(Math.random() * 5) + 5) : Math.floor(Math.random() * 5);
                }

                if (loaderView) loaderView.style.display = "none";
                if (normalView) normalView.style.display = "block";
                if (periodDisp) periodDisp.innerText = "P: " + lastKnownPeriod.slice(-4);

                if (resultText) {
                    resultText.innerText = finalOutcome + " (" + chosenNum + ")";
                    resultText.className = "prediction-text " + (finalOutcome === "BIG" ? "glow-big" : "glow-small");
                }

                if (startTxt) startTxt.innerText = "INJECT";
                if (startBtn) startBtn.style.opacity = "1";
                isScanning = false;
                playSound('success');
            }, 1200);
        }

        // ── 6. DRAGGABLE STAGE & BULLETPROOF RE-OPEN / HIDE SYSTEM ──
        const mini = document.getElementById('mini');
        const stage = document.getElementById('stage');
        const handle = document.getElementById('stageDragHandle');

        let isStageOpen = true;

        /* Universal Drag Support for Mobile Touch & Mouse */
        function makeDraggable(el, dragHandle, clickCallback) {
            let sx = 0, sy = 0, ox = 0, oy = 0;
            let isDragging = false, hasMoved = false;

            function onStart(e) {
                if (e.target.tagName.toLowerCase() === 'button' || 
                    e.target.closest('button') || 
                    e.target.closest('.frame-close-hitbox') ||
                    e.target.closest('.skin-option-card') ||
                    e.target.closest('.sub-switch')) {
                    return;
                }
                const p = e.touches ? e.touches[0] : e;
                sx = p.clientX;
                sy = p.clientY;
                const rect = el.getBoundingClientRect();
                ox = rect.left;
                oy = rect.top;
                isDragging = true;
                hasMoved = false;
                el.style.transition = 'none';
            }

            function onMove(e) {
                if (!isDragging) return;
                const p = e.touches ? e.touches[0] : e;
                const dx = p.clientX - sx;
                const dy = p.clientY - sy;
                if (Math.abs(dx) > 4 || Math.abs(dy) > 4) hasMoved = true;

                const nx = Math.max(2, Math.min(window.innerWidth - el.offsetWidth - 2, ox + dx));
                const ny = Math.max(2, Math.min(window.innerHeight - el.offsetHeight - 2, oy + dy));
                el.style.left = nx + 'px';
                el.style.top = ny + 'px';

                if (e.cancelable) e.preventDefault();
            }

            function onEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                el.style.transition = '';
                if (!hasMoved && typeof clickCallback === 'function') {
                    clickCallback();
                }
            }

            const target = dragHandle || el;
            target.addEventListener('mousedown', onStart);
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onEnd);

            target.addEventListener('touchstart', onStart, { passive: false });
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onEnd);
        }

        function openCard() {
            if (isStageOpen) return;
            isStageOpen = true;
            initAudio();
            playSound('click');

            mini.style.display = 'none';
            stage.style.display = 'block';
            stage.classList.remove('spd-close');
            stage.classList.add('spd-open');
        }

        function closeCard() {
            if (!isStageOpen) return;
            isStageOpen = false;
            initAudio();
            playSound('click');

            stage.classList.remove('spd-open');
            stage.classList.add('spd-close');
            mini.style.display = 'flex';

            setTimeout(() => {
                if (!isStageOpen) {
                    stage.style.display = 'none';
                    stage.classList.remove('spd-close');
                }
            }, 200);
        }

        function resetWindowPosition() {
            playSound('click');
            stage.style.left = 'calc(50% - 165px)';
            stage.style.top = 'calc(50% - 154px)';
        }

        // Initialize Draggables & Click Handlers
        makeDraggable(mini, null, openCard);
        makeDraggable(stage, handle, null);

        // Direct onclick fallback for mini ball to guarantee reopening
        mini.onclick = (e) => {
            openCard();
        };

        // Restore Preferences on load
        try {
            const savedSkin = localStorage.getItem('void_skin_theme');
            if (savedSkin) {
                const cardMap = {
                    'theme-void': 'skinCardVoid',
                    'theme-ice': 'skinCardIce',
                    'theme-dragon': 'skinCardDragon'
                };
                if (cardMap[savedSkin]) applySkin(savedSkin, cardMap[savedSkin]);
            }
            const savedMode = localStorage.getItem('void_target_mode');
            if (savedMode) setTargetMode(savedMode);
        } catch(e) {}

        // ── 7. BACKGROUND COSMIC STARDUST CANVAS ──
        (function() {
            const cvs = document.getElementById('bgFrame');
            if (!cvs) return;
            const ctx = cvs.getContext('2d');
            const pts = [];

            function resize() { cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
            window.addEventListener('resize', resize);
            resize();

            class Stardust {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * cvs.width;
                    this.y = cvs.height + 10;
                    this.vx = (Math.random() - 0.5) * 0.4;
                    this.vy = -(Math.random() * 1.2 + 0.3);
                    this.alpha = Math.random() * 0.5 + 0.2;
                    this.size = Math.random() * 1.6 + 0.5;
                }
                update() {
                    this.x += this.vx; this.y += this.vy;
                    this.alpha -= 0.003;
                    if (this.alpha <= 0 || this.y < -10) this.reset();
                }
                draw() {
                    ctx.globalAlpha = this.alpha;
                    let color = '#a855f7';
                    if (currentSkin === 'theme-ice') color = '#06b6d4';
                    else if (currentSkin === 'theme-dragon') color = '#eab308';
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            for (let i = 0; i < 28; i++) pts.push(new Stardust());
            function loop() {
                ctx.clearRect(0, 0, cvs.width, cvs.height);
                pts.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(loop);
            }
            loop();
        })();
    </script>
</body>
